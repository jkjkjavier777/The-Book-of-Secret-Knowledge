name: Test Suite

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      node-version: ${{ steps.node-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Determine Node.js version
        id: node-version
        run: echo "version=$(cat .nvmrc 2>/dev/null || echo '20.x')" >> $GITHUB_OUTPUT

  test:
    needs: setup
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [${{ needs.setup.outputs.node-version }}]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run unit tests
      run: npm run test:unit
    
    - name: Run integration tests
      run: npm run test:integration
      env:
        NODE_ENV: test
        OPENAI_API_KEY: mock_test_key
        DISCORD_BOT_TOKEN: mock_test_token
    
    - name: Run safety tests
      run: npm run test:safety
    
    - name: Run all tests with coverage
      run: npm run test:coverage
    
    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results
        path: |
          test-results/
          coverage/

  e2e:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ needs.setup.outputs.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Start server
      run: |
        npm start &
        sleep 5
      env:
        NODE_ENV: test
        PORT: 3001
        OPENAI_API_KEY: mock_test_key
        DISCORD_BOT_TOKEN: mock_test_token
    
    - name: Run E2E tests
      run: npm run test:e2e
      env:
        NODE_ENV: test
        PORT: 3001

  quality-gate:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    
    steps:
    - name: Check test results
      run: |
        echo "All tests passed! Quality gate approved."
        # In a real setup, you would check test results here
        # and fail if coverage is below threshold or tests failed

  scheduled-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run all tests
      run: npm run test:all
      env:
        NODE_ENV: test
        OPENAI_API_KEY: mock_test_key
        DISCORD_BOT_TOKEN: mock_test_token
