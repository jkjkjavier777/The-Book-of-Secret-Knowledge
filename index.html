<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Quantum Chatbot</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --text: #e6edf3;
    --accent: #7ee787;
    --muted: #8b949e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    display: flex;
    justify-content: center;
    padding: 24px;
  }

  /* ---------- HEADER ---------- */
  header {
    max-width: 560px;
    width: 100%;
    text-align: center;
    margin-bottom: 16px;
  }
  header h1 {
    font-size: 20px;
    margin: 0 0 4px 0;
    letter-spacing: 0.5px;
  }
  header p {
    color: var(--muted);
    font-size: 13px;
    margin: 0;
  }

  /* ---------- BODY / CHAT PANEL ---------- */
  main {
    max-width: 560px;
    width: 100%;
    background: var(--panel);
    border: 1px solid #30363d;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    height: 60vh;
  }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    font-size: 14px;
    line-height: 1.5;
  }
  .msg { margin-bottom: 10px; display: flex; align-items: baseline; gap: 6px; }
  .msg .body { flex: 1; word-break: break-word; }
  .msg.user { color: var(--text); }
  .msg.bot { color: var(--accent); }
  .msg.error { color: #f85149; }
  .msg .tag { color: var(--muted); }
  .copy-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-family: inherit;
    font-size: 12px;
    padding: 0 4px;
    flex-shrink: 0;
  }
  .copy-btn:hover { color: var(--text); }
  .copy-btn.copied { color: var(--accent); }

  form {
    display: flex;
    border-top: 1px solid #30363d;
  }
  input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 12px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  button {
    background: none;
    border: none;
    color: var(--accent);
    padding: 0 16px;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
  }
  button:disabled {
    color: var(--muted);
    cursor: default;
  }

  /* ---------- FOOTER ---------- */
  footer {
    max-width: 560px;
    width: 100%;
    text-align: center;
    margin-top: 12px;
    font-size: 11px;
    color: var(--muted);
  }
</style>
</head>
<body>

  <div style="display:flex; flex-direction:column; align-items:center; width:100%;">

    <!-- HEADER: title + tagline -->
    <header>
      <h1>&gt; quantum_chatbot</h1>
      <p>superposition in, one collapsed answer out</p>
    </header>

    <!-- BODY: chat log + input -->
    <main>
      <div id="log"></div>
      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="how are you?" autocomplete="off" />
        <button type="submit" id="send-btn">send</button>
      </form>
    </main>

    <!-- FOOTER: repo pointer -->
    <footer>talking to /api/v1/quantum/chat — powered by Mistral</footer>

  </div>

<script>
  // Point this at wherever server.js is actually running.
  // Same device/port -> leave as is. Different host -> change to that URL.
  const API_URL = window.location.origin + '/api/v1/quantum/chat';

  const log = document.getElementById('log');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');

  function addMsg(text, cls, tag) {
    const div = document.createElement('div');
    div.className = 'msg ' + cls;

    const tagSpan = document.createElement('span');
    tagSpan.className = 'tag';
    tagSpan.textContent = tag;

    const bodySpan = document.createElement('span');
    bodySpan.className = 'body';
    bodySpan.textContent = text;

    const copyBtn = document.createElement('button');
    copyBtn.className = 'copy-btn';
    copyBtn.type = 'button';
    copyBtn.textContent = 'copy';
    copyBtn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = 'copied';
        copyBtn.classList.add('copied');
        setTimeout(() => {
          copyBtn.textContent = 'copy';
          copyBtn.classList.remove('copied');
        }, 1200);
      } catch (err) {
        copyBtn.textContent = 'failed';
        setTimeout(() => { copyBtn.textContent = 'copy'; }, 1200);
      }
    });

    div.appendChild(tagSpan);
    div.appendChild(bodySpan);
    div.appendChild(copyBtn);
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  async function sendToBot(prompt) {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt })
    });
    const data = await res.json();
    if (!res.ok || data.status !== 'SUCCESS') {
      throw new Error(data.error || 'Request failed');
    }
    return data.response;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = input.value;
    if (!text.trim()) return;

    addMsg(text, 'user', '>');
    input.value = '';
    sendBtn.disabled = true;

    const thinking = addMsg('thinking...', 'bot', 'ψ');

    try {
      const reply = await sendToBot(text);
      thinking.remove();
      addMsg(reply, 'bot', 'ψ');
    } catch (err) {
      thinking.remove();
      addMsg('error: ' + err.message, 'error', '!');
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  });
</script>

</body>
</html>
